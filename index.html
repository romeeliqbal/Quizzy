<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Quizzy</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css">
</head>
<body
  <div class="container">
    <header>
      <h1>Quizzy</h1>
      <p class="subtitle">Quick multiple-choice quizzes</p>
    </header>

    <main id="app">
      <!-- quiz list -->
      <section id="quiz-list" class="panel"></section>

      <!-- quiz runner -->
      <section id="quiz-run" class="panel hidden"></section>

      <!-- results -->
      <section id="results" class="panel hidden"></section>

      <!-- past attempts -->
      <section id="history" class="panel"></section>
    </main>

    <footer>
      <small>Built for fun.</small>
    </footer>
  </div>

<script src="script.js"></script>
</body>
</html>
